<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#10171D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0B7285" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0B7285" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4A017" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="440" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="628.5" fill="none" stroke="#1A2530" stroke-width="1.5"/>

  <!-- Brand lockup: the "M + rising line" mark (from ui/logo.tsx) + wordmark -->
  <g transform="translate(72,50) scale(1.35)">
    <rect width="64" height="64" rx="16" fill="#0B0E11"/>
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="#223039" stroke-width="1.5"/>
    <circle cx="32" cy="28" r="20" fill="#0B7285" opacity="0.16"/>
    <path d="M14 46 V20 L32 38 L50 20 V46" fill="none" stroke="#F8FAFC" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13 50 L31 42 L50 30" fill="none" stroke="#D4A017" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="30" r="3.1" fill="#D4A017"/>
  </g>
  <text x="182" y="103" font-family="Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="-0.5" fill="#F8FAFC">MindMarket</text>

  <!-- Eyebrow -->
  <text x="74" y="248" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3.5" fill="#39A3B5">AI PORTFOLIO RISK ANALYTICS</text>

  <!-- Display headline (serif, matching the brand's editorial display type) -->
  <text x="72" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#F8FAFC">Know your portfolio&#8217;s risk</text>
  <text x="72" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#39A3B5">before the market tests it.</text>

  <!-- Sub-line -->
  <text x="74" y="466" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#AAB4C2">Health Score &#183; VaR &amp; stress tests &#183; factor exposure &#183; AI explanations, never invented numbers</text>

  <!-- The gold "rising line" risk motif — the brand signature -->
  <path d="M74 566 L300 566 L400 536 L540 554 L700 508 L860 528 L1126 474" fill="none" stroke="url(#goldline)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1126" cy="474" r="12" fill="#D4A017"/>
</svg>
