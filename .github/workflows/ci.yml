name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── existing Streamlit-era suite (unit + integration in tests/) ──
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: success()

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install black ruff mypy

    - name: Check formatting
      run: black --check .

    - name: Lint
      run: ruff check .

    - name: Type check
      run: mypy risk_engine.py data_provider.py
      continue-on-error: true

  # ── FastAPI backend (backend/) — separate from the root pytest job
  # because pytest.ini's testpaths skips backend/tests and addopts
  # forces --cov-fail-under=60 against the wrong codebase.
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements-backend.txt
        pip install pytest

    - name: Run backend tests
      run: pytest backend/tests -q --no-cov

  # ── Next.js frontend (frontend/) — lint + typecheck (via build) +
  # vitest suite. Mirrors `npm run lint && npm run build && npm test`.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck + build
      run: npm run build

    - name: Test
      run: npm test
