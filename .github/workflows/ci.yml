name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── existing Streamlit-era suite (unit + integration in tests/) ──
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: success()

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install black ruff mypy

    - name: Check formatting
      run: black --check .

    - name: Lint
      run: ruff check .

    - name: Type check
      run: mypy risk_engine.py data_provider.py
      continue-on-error: true

  # ── FastAPI backend (backend/) — separate from the root pytest job
  # because pytest.ini's testpaths skips backend/tests and its addopts
  # apply Streamlit-suite coverage gates against the wrong codebase.
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements-backend.txt
        pip install pytest pytest-cov mypy

    - name: Run backend tests + coverage gate
      # `-o "addopts="` wipes the inherited Streamlit `--cov=. --cov-fail-under=60`;
      # the backend gets its OWN coverage config (backend/.coveragerc — the root
      # pyproject omits backend/*). Baseline 87.3% → floor 85% (docs/ci-hardening.md).
      run: |
        pytest backend/tests -q -o "addopts=" \
          --cov=backend/app --cov-config=backend/.coveragerc \
          --cov-report=term-missing:skip-covered --cov-fail-under=85

    - name: Type check — backend trust boundary (blocking)
      # schemas + core are strict-clean (disallow_untyped_defs); this job installs
      # the app deps so mypy sees real pydantic types. services/api stay advisory.
      run: mypy --config-file backend/mypy.ini backend/app/schemas backend/app/core

  # ── Copilot grounding eval — offline deterministic-template mode (no LLM
  # key). Advisory for now (mypy precedent): backend-tests already hard-gates
  # the same 30-case run via test_ai_eval_grounding.py; this job surfaces the
  # faithfulness report as its own visible check.
  copilot-eval:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements-backend.txt

    - name: Grounding eval (offline template mode)
      run: python evals/run_grounding_eval.py --threshold 0.98

  # ── Dependency vulnerability scan (advisory). Non-blocking until the known
  # starlette findings are resolved via a fastapi/starlette ceiling bump
  # (docs/ci-hardening.md); then flip continue-on-error off.
  dep-scan:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pip-audit
      run: pip install pip-audit

    - name: Audit backend runtime deps
      run: pip-audit -r requirements.txt -r backend/requirements-backend.txt

    - name: Audit frontend deps
      working-directory: frontend
      run: npm audit --omit=dev || true

  # ── Next.js frontend (frontend/) — lint + typecheck (via build) +
  # vitest suite. Mirrors `npm run lint && npm run build && npm test`.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck + build
      run: npm run build

    - name: Test
      run: npm test

  # ── Deploy-config validation — compose files + the LIVE Caddyfile.
  # The EC2 boot unit runs `git reset --hard origin/main`, so a bad committed
  # Caddyfile is a GUARANTEED future outage (a parse error crash-looped Caddy
  # on the 2026-06-20 reboot — see docs/aws/ci-image-deploy.md "Boot
  # behavior"). This job turns that class of mistake into a red PR. Pure
  # static validation; nothing is deployed.
  validate-config:
    runs-on: ubuntu-latest

    env:
      # Dummy values — interpolation-only, so `config -q` stays warning-free.
      SITE_HOST: example.com
      MM_IMAGE_TAG: latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate compose files
      run: |
        docker compose -f compose.split.yml config -q
        docker compose -f compose.aws.yml config -q

    - name: Validate Caddyfile (same pinned image as prod — compose.aws.yml)
      run: |
        # The site block pins the Cloudflare Origin CA cert via
        # `tls /srv/tls/...` and `caddy validate` LOADS cert files during
        # provisioning — so give it a throwaway self-signed pair at the same
        # paths, shaped like the real cert (apex + wildcard SANs).
        mkdir -p tlsdummy
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout tlsdummy/origin.key -out tlsdummy/origin.pem \
          -subj "/CN=example.com" \
          -addext "subjectAltName=DNS:example.com,DNS:*.example.com" \
          2>/dev/null
        docker run --rm \
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
          -v "$PWD/tlsdummy:/srv/tls:ro" \
          -e SITE_HOST=example.com \
          caddy:2.11-alpine \
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # ── E2E (Playwright) — the auth-gated core journey (dashboard score +
  # streaming copilot), driven against a FULLY MOCKED network: no real
  # backend, Supabase, LLM, or paid API. Deterministic, so it runs by
  # default; a separate job so it never blocks the unit suite above.
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run E2E (mocked, deterministic)
      run: npm run test:e2e

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7
