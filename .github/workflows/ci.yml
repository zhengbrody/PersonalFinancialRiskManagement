name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── existing Streamlit-era suite (unit + integration in tests/) ──
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: pytest

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: success()

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install black ruff mypy

    - name: Check formatting
      run: black --check .

    - name: Lint
      run: ruff check .

    - name: Type check
      run: mypy risk_engine.py data_provider.py
      continue-on-error: true

  # ── FastAPI backend (backend/) — separate from the root pytest job
  # because pytest.ini's testpaths skips backend/tests and its addopts
  # apply Streamlit-suite coverage gates against the wrong codebase.
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements-backend.txt
        pip install pytest

    - name: Run backend tests
      # `-o "addopts="` wipes the inherited Streamlit `--cov=. --cov-fail-under=60`
      # so this job stays self-contained: no pytest-cov dep, no false
      # coverage gate against unrelated code. Backend coverage gets its
      # own measurement separately when we wire it up.
      run: pytest backend/tests -q -o "addopts="

  # ── Next.js frontend (frontend/) — lint + typecheck (via build) +
  # vitest suite. Mirrors `npm run lint && npm run build && npm test`.
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Typecheck + build
      run: npm run build

    - name: Test
      run: npm test

  # ── E2E (Playwright) — the auth-gated core journey (dashboard score +
  # streaming copilot), driven against a FULLY MOCKED network: no real
  # backend, Supabase, LLM, or paid API. Deterministic, so it runs by
  # default; a separate job so it never blocks the unit suite above.
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run E2E (mocked, deterministic)
      run: npm run test:e2e

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7
