name: E2E (real auth, nightly)

# A GATED, real-environment smoke — distinct from the per-PR mocked `e2e` job in
# ci.yml. It logs a real Supabase TEST user into the deployed app and checks the
# real /login → session → protected-route chain. It runs ONLY on a schedule and
# on manual dispatch (never on PRs), and the spec self-skips unless the secrets
# below are set, so it's a safe no-op until you opt in.
#
# To enable: add repo secrets E2E_REAL_EMAIL + E2E_REAL_PASSWORD (a throwaway
# test account). Optionally set repo variable E2E_BASE_URL (defaults to
# https://mindmarket.app).

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch:

# issues:write — the failure step below opens/refreshes a tracking issue so a
# red nightly prod smoke actively pings the owner (GitHub's default failure
# email for scheduled runs is easy to miss; an issue is loud and persistent).
permissions:
  contents: read
  issues: write

jobs:
  e2e-real:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      E2E_REAL_EMAIL: ${{ secrets.E2E_REAL_EMAIL }}
      E2E_REAL_PASSWORD: ${{ secrets.E2E_REAL_PASSWORD }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run real-auth smoke (skips automatically if secrets are unset)
      run: npm run test:e2e:real

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-real-report
        path: frontend/playwright-report/
        retention-days: 7

    # This nightly run is currently the ONLY synthetic probe of production.
    # On failure, open (or refresh) a tracking issue — the site being down at
    # 2am must not wait for someone to happen to read an Actions digest email.
    - name: Alert on failure (open/refresh a tracking issue)
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        title="Nightly real-auth prod smoke FAILED"
        body="Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        num=$(gh issue list --state open --search "\"$title\" in:title" \
              --json number --jq '.[0].number' || true)
        if [ -n "$num" ]; then
          gh issue comment "$num" --body "$body"
        else
          gh issue create --title "$title" --body "$body"
        fi
