# Offline retraining of the market-regime classifier.
#
# Training NEVER runs on the EC2 box (RAM) or in the request path — it runs here
# on a GH runner, fetches free market history (yfinance), trains the sklearn
# model, and commits the refreshed artifact (backend/app/ml/artifacts/).
#
# ⚠️ That artifact commit does NOT trigger any other workflow: it is pushed
# with the default GITHUB_TOKEN (GitHub never chains workflows off such
# pushes) AND carries [skip ci]. So the retrained model ships with the NEXT
# code deploy — or immediately via a manual `gh workflow run build-images.yml`.
# Note it also lands on main UNTESTED (ci.yml is skipped too); the runtime
# loader fail-softs to a heuristic if the artifact is bad, and you can vet it
# first with a manual ci.yml dispatch before building images.
#
# Manual (`workflow_dispatch`) or weekly. NOT on push — so it can't loop on its
# own artifact commit. A flaky yfinance fetch just fails the run; re-dispatch.

name: Train regime model

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # to commit the refreshed artifact

concurrency:
  group: train-regime
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements-backend.txt
          pip install -r backend/app/ml/requirements-train.txt
      - name: Train + write artifact
        # --config is REQUIRED wiring: without it the run stamps the code-default
        # model_version ("regime-v1") instead of the YAML's semantic version, and
        # the [skip ci] artifact commit breaks test_model_card on the NEXT PR
        # (exactly what the 2026-07-12 weekly run did).
        run: python -m backend.app.ml.train --config backend/app/ml/configs/risk_today.yaml
      - name: Commit artifact if changed
        run: |
          git config user.name "regime-train-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backend/app/ml/artifacts/regime_model.joblib backend/app/ml/artifacts/regime_meta.json
          if git diff --cached --quiet; then
            echo "No artifact change — skipping commit."
          else
            git commit -m "chore(ml): retrain regime model [skip ci]"
            git push origin HEAD:main
          fi
