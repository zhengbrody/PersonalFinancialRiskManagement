# Daily ML health heartbeat. Turns the run RED and keeps exactly ONE open issue
# per alert kind:
#
#   endpoint        /api/v1/ml/health unreachable
#   drift           overall_status == drift (server-side, see ADR 0005)
#   freshness       served model older than MINDMARKET_ML_STALE_DAYS (default 21)
#   artifact        serving model bytes != the approved hash in its provenance
#   train_pipeline  latest completed train-regime run did not succeed
#
# Firing → open the kind's issue or comment on it (never a second issue).
# Recovered → comment + close it. Unknown (cannot judge today) → leave it.
# Classification lives in scripts/ml_health_alerts.py (unit-tested).
#
# The pipeline result is NOT knowable from the serving box, so it is read
# from the Actions API here. No secrets: the endpoint is public and the
# default token reads this repo's runs.
#
# NOTE the coupling to train-regime.yml: the drift verdict compares the live
# feature window against regime_reference.json, which must be regenerated
# alongside the model — train-regime.yml commits both in its retrain PR.

name: ml-health

on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC ≈ 9am ET, after US pre-market data settles
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # latest train-regime run conclusion
  issues: write # a red daily cron must page, not sit in an Actions digest

concurrency:
  group: ml-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe /api/v1/ml/health
        # --retry: a transient Cloudflare/network blip must not be
        # indistinguishable from real model drift. A failed probe is NOT a
        # step failure here — it is classified as the `endpoint` kind below.
        run: |
          set -uo pipefail
          if curl -fsS --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
               -A "Mozilla/5.0 (mindmarket ml-health monitor)" \
               "https://mindmarket.app/api/v1/ml/health" -o "$RUNNER_TEMP/health.json"; then
            echo "ml health: $(cat "$RUNNER_TEMP/health.json")"
          else
            echo "::warning::health probe failed"
            : > "$RUNNER_TEMP/health.json"
          fi

      - name: Latest completed train-regime run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow train-regime.yml \
            --status completed --limit 1 --json conclusion,url,createdAt \
            > "$RUNNER_TEMP/train.json" || : > "$RUNNER_TEMP/train.json"
          echo "train-regime: $(cat "$RUNNER_TEMP/train.json")"

      - name: Classify, then open / comment / close one issue per kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ml_health_alerts.py \
            --health "$RUNNER_TEMP/health.json" \
            --train-run "$RUNNER_TEMP/train.json" > "$RUNNER_TEMP/kinds.json"
          cat "$RUNNER_TEMP/kinds.json"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          open_issues=$(gh issue list --state open --limit 200 --json number,title)
          firing=0
          while IFS=$'\t' read -r kind state title detail; do
            num=$(echo "$open_issues" | jq -r --arg t "$title" \
                  '[.[] | select(.title == $t)] | .[0].number // empty')
            body="${kind}: ${detail}
          Run: ${run_url}"
            case "$state" in
              firing)
                firing=1
                echo "::error::${kind} firing — ${detail}"
                if [ -n "$num" ]; then
                  gh issue comment "$num" --body "Still firing. $body"
                else
                  gh issue create --title "$title" --body "$body"
                fi ;;
              ok)
                if [ -n "$num" ]; then
                  gh issue comment "$num" --body "Recovered — closing automatically. $body"
                  gh issue close "$num"
                fi ;;
              *) echo "${kind}: unknown (${detail}) — issue left as is" ;;
            esac
          done < <(jq -r 'to_entries[] | [.key, .value.state, .value.title, .value.detail] | @tsv' \
                     "$RUNNER_TEMP/kinds.json")
          if [ "$firing" = 1 ]; then
            exit 1
          fi
