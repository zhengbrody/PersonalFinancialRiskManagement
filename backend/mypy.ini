# mypy config for the backend TRUST BOUNDARY — the modules that parse/validate
# untrusted input (schemas) and enforce auth/errors (core). These are fully
# typed today, so this gate is BLOCKING (no continue-on-error): new schema/core
# code must type-check.
#
# Run (see .github/workflows/ci.yml code-quality job + scripts/ci_checks.sh):
#   mypy --config-file backend/mypy.ini backend/app/schemas backend/app/core
#
# INCREMENTAL ROADMAP: backend/app/services (~130 mypy errors) and
# backend/app/api (~140) stay OUT of the blocking set for now. Ratchet them in
# module-by-module as they're cleaned; the legacy root modules
# (risk_engine.py, data_provider.py) remain advisory.
[mypy]
python_version = 3.12
ignore_missing_imports = True
disallow_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
