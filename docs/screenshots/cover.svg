<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#0E141A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#46B4C6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#46B4C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#D4A017" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#D4A017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="397" y1="0" x2="683" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EF4444"/>
      <stop offset="0.5" stop-color="#E0AE2A"/>
      <stop offset="1" stop-color="#46B4C6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46B4C6"/>
      <stop offset="1" stop-color="#D4A017"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glow)"/>
  <rect width="1080" height="1350" fill="url(#glow2)"/>
  <rect x="20" y="20" width="1040" height="1310" rx="28" fill="none" stroke="#1C2630" stroke-width="1.5"/>

  <!-- header: logo mark + wordmark -->
  <g>
    <rect x="72" y="64" width="48" height="48" rx="13" fill="#10171D" stroke="#39A3B5" stroke-width="1.5"/>
    <polyline points="84,102 94,90 103,97 112,76" fill="none" stroke="#46B4C6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="76" r="4" fill="#D4A017"/>
    <text x="136" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#F4F7F9" letter-spacing="0.3">MindMarket</text>
  </g>
  <g transform="translate(1008,82)" text-anchor="end">
    <circle cx="-104" cy="-5" r="5" fill="#34D399"/>
    <text x="0" y="0" font-family="Menlo, monospace" font-size="20" fill="#8A9AA5" letter-spacing="1.5">LIVE · mindmarket.app</text>
  </g>

  <!-- eyebrow -->
  <text x="540" y="312" text-anchor="middle" font-family="Menlo, monospace" font-size="22" fill="#46B4C6" letter-spacing="4.5">FULL-STACK · AI · FINTECH · SHIPPED</text>

  <!-- headline -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#F4F7F9" text-anchor="middle">
    <text x="540" y="408" font-size="76">I built &amp; shipped a</text>
    <text x="540" y="496" font-size="76">production-grade</text>
    <text x="540" y="584" font-size="76">risk-analytics <tspan fill="#46B4C6">SaaS.</tspan></text>
  </g>

  <!-- subhead + swipe invite -->
  <text x="540" y="654" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#9AAAB4">Solo — quant engine · AI copilot · cloud infra · billing.</text>
  <text x="540" y="700" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="27" fill="#D4A017">Here's the system →</text>

  <!-- gauge -->
  <g>
    <!-- faint track -->
    <path d="M 397 1022.5 A 165 165 0 1 1 683 1022.5" fill="none" stroke="#1C2630" stroke-width="20" stroke-linecap="round"/>
    <!-- colored arc -->
    <path d="M 397 1022.5 A 165 165 0 1 1 683 1022.5" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round"/>
    <!-- scale ends -->
    <text x="372" y="1050" text-anchor="middle" font-family="Menlo, monospace" font-size="18" fill="#6B7B85">0</text>
    <text x="708" y="1050" text-anchor="middle" font-family="Menlo, monospace" font-size="18" fill="#6B7B85">1000</text>
    <!-- value marker sitting on the arc at ~78% -->
    <circle cx="692" cy="876" r="13" fill="#0B0E11" stroke="#F4F7F9" stroke-width="3"/>
    <circle cx="692" cy="876" r="5" fill="#D4A017"/>
    <!-- center reading -->
    <text x="540" y="952" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#F4F7F9">780</text>
    <text x="540" y="986" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#8A9AA5" letter-spacing="3">PORTFOLIO HEALTH</text>
  </g>

  <!-- stat strip -->
  <text x="540" y="1110" text-anchor="middle" font-family="Menlo, monospace" font-size="22" fill="#C7D2D8" letter-spacing="1">
    <tspan fill="#34D399">● LIVE</tspan>   ·   600+ TESTS   ·   SOLO BUILD
  </text>

  <!-- tech line -->
  <text x="540" y="1170" text-anchor="middle" font-family="Menlo, monospace" font-size="20" fill="#7E8E98" letter-spacing="1.5">Next.js · TypeScript · FastAPI · Python · AWS · Docker</text>

  <!-- accent rule -->
  <rect x="486" y="1212" width="108" height="4" rx="2" fill="url(#rule)"/>

  <!-- footer -->
  <text x="72" y="1300" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#46B4C6">mindmarket.app</text>
  <text x="1008" y="1300" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#6B7B85">swipe →</text>
</svg>
